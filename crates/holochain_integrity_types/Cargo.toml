[package]
name = "holochain_integrity_types"
version.workspace = true
description = "Holochain integrity types"
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/holochain_integrity_types"
authors = ["Holochain Core Dev Team <devcore@holochain.org>"]
edition = "2021"

[dependencies]
holo_hash = { workspace = true, features = ["encoding"] }
holochain_serialized_bytes = "=0.0.57"
holochain_util = { workspace = true }
holochain_secure_primitive = { workspace = true }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_bytes = "0.11"
schemars = { version = "0.9", optional = true }

# Just the bare minimum timestamp with no extra features.
holochain_timestamp = { workspace = true }

# TODO: Figure out how to remove these dependencies.
subtle = "2"

# full-dna-def dependencies
derive_builder = { version = "0.20", optional = true }

# Optional
proptest = { version = "1", optional = true }
proptest-derive = { version = "0", optional = true }
subtle-encoding = { version = "0.5", optional = true }
tracing = { version = "0.1", optional = true }
ts-rs = { version = "12.0", features = ["no-serde-warnings"], optional = true }

[dev-dependencies]
holochain_integrity_types = { path = ".", features = ["test_utils", "fuzzing"] }
serde_json = "1.0"
fixt = { workspace = true }

[lints]
workspace = true

[features]
default = []

hashing = ["holo_hash/hashing"]

full = [
  "default",
  "hashing",
  "dep:subtle-encoding",
  "holochain_timestamp/now",
  "schema",
]

full-dna-def = ["dep:derive_builder"]

schema = ["dep:schemars"]

fuzzing = [
  "dep:proptest",
  "dep:proptest-derive",
  "holochain_serialized_bytes/fuzzing",
  "holo_hash/fuzzing",
]

test_utils = [
  "full",
  "holochain_timestamp/now",
  "holo_hash/hashing",
  "holo_hash/test_utils",
]

ts_rs = ["dep:ts-rs", "holo_hash/ts_rs", "holochain_timestamp/ts_rs"]
