[package]
name = "holochain_timestamp"
version.workspace = true
description = "Microsecond-precision timestamp datatype for Holochain"
license = "Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/holochain_timestamp"
authors = ["Holochain Core Dev Team <devcore@holochain.org>"]
keywords = ["holochain", "p2p", "dht", "networking"]
categories = ["date-and-time"]
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
ts-rs = { version = "12.0", features = ["no-serde-warnings"], optional = true }

# Dependencies not needed for integrity.
chrono = { version = "0.4.22", default-features = false, features = [
  "clock",
  "std",
  "oldtime",
  "serde",
], optional = true }

[dev-dependencies]
holochain_serialized_bytes = "=0.0.57"

[lints]
workspace = true

[features]
default = ["now"]

now = ["dep:chrono"]
ts_rs = ["dep:ts-rs"]
